# =========================================================================
# Los valores con fuente pública llevan la cita en la línea de al lado.
# Lo que queda por decidir es criterio de Paty y vive en un solo sitio:
# el bloque 'decisiones_pendientes' de abajo, que el validador repite en
# cada reporte hasta que se cierre.
# =========================================================================

id: ablactancia_6_meses
nombre: Inicio de alimentación complementaria — 6 meses
edad_min_meses: 6
edad_max_meses: 6
descripcion: >
  Primer mes de alimentación complementaria. La leche materna o fórmula sigue
  siendo la fuente principal de energía; la comida cumple función de aprendizaje,
  aporte de hierro y exposición progresiva a sabores y texturas.

# ---------------------------------------------------------------
# ANATOMÍA DEL DÍA
# Nota: estructura radicalmente distinta al protocolo escolar.
# Menos tiempos, textura como componente explícito, y la leche
# aparece como marco del día, no como una comida más.
# ---------------------------------------------------------------
marco_diario:
  leche: a demanda            # se imprime como nota fija, no se planifica
  nota_plan: >
    La leche materna o fórmula continúa a libre demanda. Las comidas
    no la reemplazan: la acompañan.

comidas:
  # 'fruta_vitc' no es un capricho de estructura: es el sitio donde el motor
  # coloca la fruta que exige la regla acoplada de la menestra (hierro no
  # hemínico + vitamina C en la misma toma). Sin este componente la regla no
  # tenía dónde aterrizar y no se cumplía nunca.
  - id: almuerzo
    nombre: Almuerzo
    hora: "12:00 – 1:00"
    componentes: [base_energetica, proteina_hierro, verdura, grasa, fruta_vitc]

  # Dos comidas al día desde los 6 meses: MINSA/INS Perú, alimentación
  # complementaria 6–8 meses, «2 a 3 comidas al día». Por eso no lleva
  # 'activo_desde_semana': la segunda toma entra desde la semana 1.
  - id: media_tarde
    nombre: Media tarde
    hora: "3:30 – 4:00"
    componentes: [fruta]

# ---------------------------------------------------------------
# FRECUENCIAS SEMANALES
# ---------------------------------------------------------------
frecuencias_semanales:
  - componente: proteina_hierro
    en: [almuerzo]
    veces: 7
    modo: exacto
    razon: el hierro es el nutriente crítico de esta etapa

  - componente: grasa
    en: [almuerzo]
    veces: 7
    modo: exacto
    razon: densidad calórica en volumen pequeño

  # 1×/semana y no más: el hígado es la fuente más concentrada de vitamina A
  # preformada del catálogo y el margen entre la recomendación (500 µg/d a los
  # 7–12 m) y el límite superior es estrecho. El hierro animal de los otros seis
  # días lo cubre la regla de arriba — MINSA: dos cucharadas diarias de alimento
  # de origen animal rico en hierro.
  - componente: proteina_hierro
    familia: higado
    en: [almuerzo]
    veces: 1
    modo: exacto

  # OMS 2023, alimentación complementaria 6–23 meses: «Pulses, nuts and seeds
  # should be consumed frequently». Se sostiene a los 6 meses con la menestra
  # bien cocida y aplastada; ver la nota de edad en datos/alimentos_base.yaml.
  - componente: proteina_hierro
    familia: menestra
    en: [almuerzo]
    veces: 2
    modo: exacto

# ---------------------------------------------------------------
# INTRODUCCIÓN PROGRESIVA
# Regla propia de este protocolo: no existe en el escolar.
# ---------------------------------------------------------------
introduccion_progresiva:
  activa: true
  dias_por_alimento_nuevo: 3       # 2–3 días es el rango de las guías; ver reglas_exclusion/reglas_6_meses.md
  max_alimentos_nuevos_semana: 3   # derivado: 7 días / 3 días por alimento
  alergenos_mayores:
    introducir: true
    uno_por_vez: true
    dias_observacion: 3            # mismo rango 2–3 días, para poder aislar la reacción
    nota_qa: >
      El plan debe señalar explícitamente qué día se introduce cada alérgeno
      mayor y dejar constancia de la ventana de observación.

# ---------------------------------------------------------------
# TEXTURA
# MINSA/INS fija la banda de los 6–8 meses —«comidas espesas: papillas, puré o
# mazamorras»— y sitúa el aplastado con grumos en los 7–8 meses. Dentro de esa
# banda, el ritmo semana a semana es criterio de Paty: ver decisiones_pendientes.
# ---------------------------------------------------------------
progresion_textura:
  semana_1: papilla lisa
  semana_2: papilla lisa
  semana_3: aplastado con tenedor
  semana_4: aplastado con grumos suaves

# ---------------------------------------------------------------
# ROTACIONES
# ---------------------------------------------------------------
rotaciones:
  - componente: base_energetica
    en: [almuerzo]
    reparto: {papa_pure: 2, camote_pure: 2, zapallo_pure: 1, arroz_pure: resto}

  # Espinaca y brócoli no hace falta excluirlos aquí: el catálogo ya los deja
  # fuera por edad (12 m y 8 m), y el filtro de edad corre antes que la rotación.
  - componente: verdura
    en: [almuerzo]
    reparto: {zanahoria: 3, zapallo: resto}

# ---------------------------------------------------------------
# REGLAS ACOPLADAS
# ---------------------------------------------------------------
reglas_acopladas:
  - si: proteina_hierro.menestra
    entonces: fruta_vitc
    ambito: mismo_dia
    razon: absorción de hierro no hemínico

# (La grasa no necesita regla acoplada: ya es obligatoria 7 veces por semana
#  en 'frecuencias_semanales'.)

# ---------------------------------------------------------------
# EXCLUSIONES DURAS
# El motor NO las hace cumplir: ninguno de estos alimentos está en el catálogo,
# así que no hay nada que filtrar. El validador las repite como aviso en cada
# reporte para que consten en la revisión clínica. reglas_exclusion/ es material
# de lectura humana y no lo lee ningún módulo.
# ---------------------------------------------------------------
exclusiones_duras:
  - miel
  - sal_anadida
  - azucar_anadida
  - edulcorantes
  - leche_vaca_como_bebida
  - jugos
  - frutos_secos_enteros
  - alimentos_redondos_duros

# ---------------------------------------------------------------
# VARIEDAD
# ---------------------------------------------------------------
variedad:
  no_repetir_dia_completo: false   # a esta edad la repetición es deseable
  max_veces_misma_receta_semana: 4   # decidido por Paty (encargo 3, §9)
  min_recetas_distintas_semana: 2    # decidido por Paty (encargo 3, §9)

# ---------------------------------------------------------------
# AJUSTES POR DIAGNÓSTICO
# ---------------------------------------------------------------
preferencias_clinicas:
  anemia:
    priorizar_aporta: [hierro, vitamina_c]
    nota_qa: valorar si corresponde suplementación además del plan

  estrenimiento:
    priorizar_aporta: [fibra, grasas_saludables]
    nota_qa: revisar aporte hídrico y proporción de plátano/manzana

  aplv:
    # Solo 'lacteos'. Antes decía [lacteos, derivados_lacteos] y esa segunda
    # etiqueta no existe en el catálogo: una etiqueta inventada no excluye nada.
    # 'lacteos' ya cubre la leche y sus derivados (yogurt, queso) en
    # datos/alimentos_base.yaml, y el validador bloquea el plan si alguna vez
    # deja de existir.
    exclusiones_extra: [lacteos]
    nota_qa: verificar trazas en productos procesados

# Las tres decisiones que este bloque dejaba abiertas —progresión de textura,
# recetas distintas por semana y repeticiones por semana— las cerró Paty en el
# encargo 3 (§9). Los valores están arriba, cada uno con su fuente en la línea
# de al lado, y el bloque `decisiones_pendientes` desaparece: un archivo que
# sigue preguntando lo que ya se respondió acaba llenando de ruido todos los
# reportes y enseñando a no leerlos.

# ---------------------------------------------------------------
# GRAMÁTICA DE SLOTS · Capa 2
# ---------------------------------------------------------------
# A los seis meses la comida es un solo plato y la papilla es el formato
# correcto, así que aquí no hay presupuesto de demanda oral que repartir: lo que
# el tipado protege es otra cosa —que el slot del hierro lo llene una fuente de
# hierro y no un puré de zapallo, que es el error que en esta franja hace daño.
gramatica:
  base_energetica: {papel: ENERGIA,  roles: [cereal, tuberculo], fuentes: [base_energetica]}
  proteina_hierro: {papel: PROTEINA, roles: [proteina_animal, proteina_vegetal, menestra],
                    fuentes: [proteina_hierro]}
  verdura:         {papel: VEGETAL,  roles: [verdura], fuentes: [verdura]}
  grasa:           {papel: GRASA,    roles: [grasa],   fuentes: [grasa]}
  fruta_vitc:      {papel: FRUTA,    roles: [fruta],   fuentes: [fruta_vitc]}
  fruta:           {papel: FRUTA,    roles: [fruta],   fuentes: [fruta, fruta_vitc]}

presupuesto_sensorial:
  comidas_principales: [almuerzo]
  comidas_sin_reto: []
