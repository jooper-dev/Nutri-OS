# Alimentos base — Nutri-OS
#
# Componentes simples que NO son recetas del recetario: acompañamientos que se
# preparan sin instrucciones (arroz graneado, papa sancochada, fruta picada).
# En el sistema anterior esto era el "Frente 2 · Creaciones ad-hoc".
#
# Las CANTIDADES no viven aquí: las aporta `porciones` de la ficha del paciente,
# porque dependen del requerimiento calórico de cada niño.
#
# Campos por alimento:
#   id             identificador interno
#   nombre         como se imprime en el plan
#   edad_min_meses edad mínima segura
#   alergenos      lista; se cruza contra las alergias del paciente
#   familia        opcional, el "cajón" al que pertenece (ver abajo)
#   aporta         opcional, para priorización clínica
#   nunca_recomendar  opcional. true = fuera de todo plan, para todo paciente,
#                  por decisión clínica de Paty. No depende de que nadie se
#                  acuerde: filtra antes que la edad y las alergias, y el
#                  validador bloquea el plan si el alimento aparece igualmente.
#
# Sobre `familia` — el protocolo nombra alimentos en dos niveles:
#
#   {tuberculo: 4}   el cajón: "cuatro tubérculos por semana", y que el catálogo
#                    decida cuáles. Un tubérculo andino nuevo entra solo.
#   {camote: 2}      el alimento concreto, cuando la razón clínica es de ESE
#                    alimento y no de su cajón.
#
# Los dos funcionan como clave de rotación o de frecuencia, y se pueden mezclar
# en la misma regla. Por eso los cajones de abajo son CULINARIOS, no botánicos:
# el camote es una raíz, pero en la olla se usa como la papa y el protocolo los
# trata igual, así que comparten cajón. Si `familia` falta, el alimento es su
# propio cajón de un solo miembro, y solo se le puede pedir por su nombre.

carbohidrato:
  # Cajones: grano · grano_andino · tuberculo · raiz · pasta
  - {id: arroz,    nombre: "Arroz",             edad_min_meses: 6,  alergenos: [], familia: grano,        textura: seca}
  - {id: papa,     nombre: "Papa sancochada",   edad_min_meses: 6,  alergenos: [], familia: tuberculo,    textura: blanda}
  - {id: camote,   nombre: "Camote sancochado", edad_min_meses: 6,  alergenos: [], familia: tuberculo,    aporta: [fibra, betacarotenos], textura: blanda}
  - {id: quinua,   nombre: "Quinua",            edad_min_meses: 6,  alergenos: [], familia: grano_andino, aporta: [proteina], textura: humeda}
  - {id: fideos,   nombre: "Fideos",            edad_min_meses: 8,  alergenos: [gluten], familia: pasta,  textura: humeda}
  - {id: yuca,     nombre: "Yuca sancochada",   edad_min_meses: 8,  alergenos: [], familia: raiz,         textura: blanda}

base_energetica:
  - {id: papa_pure,    nombre: "Papa aplastada",    edad_min_meses: 6, alergenos: [], textura: humeda}
  - {id: camote_pure,  nombre: "Camote aplastado",  edad_min_meses: 6, alergenos: [], aporta: [betacarotenos], textura: humeda}
  - {id: zapallo_pure, nombre: "Zapallo aplastado", edad_min_meses: 6, alergenos: [], aporta: [betacarotenos], textura: humeda}
  - {id: arroz_pure,   nombre: "Arroz bien cocido", edad_min_meses: 6, alergenos: [], textura: humeda}

cereal:
  # Cajones: hojuelas · harinas · grano_andino. La avena se queda en su propio
  # cajón a propósito: si entrara en 'hojuelas' podría salir en la ranura de
  # 'hojuelas: resto' y aparecer tres veces por semana en vez de dos, que es lo
  # que dice la rotación. No se gana nada y se pierde una frecuencia escrita.
  - {id: avena,      nombre: "Avena",              edad_min_meses: 6, alergenos: [], familia: avena,    aporta: [fibra], textura: humeda}
  - {id: canihua,    nombre: "Cañihua",            edad_min_meses: 6, alergenos: [], familia: grano_andino, aporta: [hierro, proteina], textura: humeda}
  - {id: maca,       nombre: "Harina de maca",     edad_min_meses: 12, alergenos: [], familia: harinas, textura: humeda}
  - {id: algarrobo,  nombre: "Harina de algarrobo", edad_min_meses: 12, alergenos: [], familia: harinas, aporta: [hierro], textura: humeda}
  - {id: siete_sem,  nombre: "Harina 7 semillas",  edad_min_meses: 12, alergenos: [ajonjoli, soya], familia: harinas, textura: humeda}
  - {id: kiwicha,    nombre: "Hojuelas de kiwicha", edad_min_meses: 6, alergenos: [], familia: hojuelas, aporta: [hierro], textura: crujiente}
  - {id: quinua_hoj, nombre: "Hojuelas de quinua",  edad_min_meses: 6, alergenos: [], familia: hojuelas, aporta: [proteina], textura: crujiente}

menestra:
  - {id: lentejas,      nombre: "Lentejas",       edad_min_meses: 7, alergenos: [], familia: menestra, aporta: [hierro, fibra], textura: humeda}
  - {id: frejol_cast,   nombre: "Frejol castilla", edad_min_meses: 8, alergenos: [], familia: menestra, aporta: [hierro, fibra], textura: humeda}
  - {id: panamito,      nombre: "Frejol panamito", edad_min_meses: 8, alergenos: [], familia: menestra, aporta: [hierro, fibra], textura: humeda}
