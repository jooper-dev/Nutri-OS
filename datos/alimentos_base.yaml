proteina:
  - {id: pollo,     nombre: "Pollo",          edad_min_meses: 6,  alergenos: [],         familia: pollo,   aporta: [proteina, hierro], textura: seca}
  - {id: pescado,   nombre: "Pescado",        edad_min_meses: 6,  alergenos: [pescado],  familia: pescado, aporta: [proteina, omega3], textura: seca}
  - {id: res,       nombre: "Carne de res",   edad_min_meses: 7,  alergenos: [carne_mamifero], familia: res, aporta: [proteina, hierro, zinc], textura: seca}
  - {id: huevo,     nombre: "Huevo",          edad_min_meses: 6,  alergenos: [huevo],    familia: huevo,   aporta: [proteina], textura: blanda}
  - {id: pavita,    nombre: "Pavita",         edad_min_meses: 6,  alergenos: [],         familia: pollo,   aporta: [proteina], textura: seca}

proteina_hierro:
  - {id: higado_pollo, nombre: "Hígado de pollo", edad_min_meses: 6, alergenos: [], familia: higado, aporta: [hierro, vitamina_a], textura: blanda}
  # NUNCA SE RECOMIENDA. No es una preferencia ni un ajuste de temporada: es una
  # posición clínica sostenida de la Nut. Patricia López, mantenida frente a
  # ofertas de patrocinio que rechazó. Se deja en el catálogo, y no se borra, para
  # que la regla sea visible y para que nadie la vuelva a añadir por descuido
  # creyendo que faltaba.
  #
  # `nunca_recomendar` excluye el alimento para TODOS los pacientes, antes que
  # cualquier otro filtro, y el validador bloquea el plan si aparece. Cierra de
  # paso la duda que quedaba abierta sobre etiquetarla `carne_mamifero` según sea
  # de res o de pollo: si no entra en ningún plan, la etiqueta es indiferente.
  - {id: sangrecita,   nombre: "Sangrecita",      edad_min_meses: 6, alergenos: [], familia: higado, aporta: [hierro], textura: blanda, nunca_recomendar: true}
  - {id: bazo,         nombre: "Bazo",            edad_min_meses: 7, alergenos: [carne_mamifero], familia: higado, aporta: [hierro], textura: blanda}
  - {id: pollo_desm,   nombre: "Pollo deshilachado", edad_min_meses: 6, alergenos: [], familia: pollo, aporta: [proteina, hierro], textura: seca}
  # Menestra aplastada desde los 6 meses: OMS 2023, «Guideline for complementary
  # feeding of infants and young children 6–23 months of age» — «Pulses, nuts and
  # seeds should be consumed frequently». La condición es la preparación, y estas
  # dos la cumplen: lenteja y arveja partida se deshacen al cocer y van sin
  # cáscara. El frejol panamito se queda en 8 m porque la piel entera no se
  # deshace igual y es la que da el problema.
  - {id: lentejas_pure, nombre: "Lentejas aplastadas",      edad_min_meses: 6, alergenos: [], familia: menestra, aporta: [hierro, fibra], textura: humeda}
  - {id: panamito_pure, nombre: "Frejol panamito aplastado", edad_min_meses: 8, alergenos: [], familia: menestra, aporta: [hierro, fibra], textura: humeda}
  - {id: arveja_pure,   nombre: "Arveja partida aplastada",  edad_min_meses: 6, alergenos: [], familia: menestra, aporta: [hierro, fibra], textura: humeda}

