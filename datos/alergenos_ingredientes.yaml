# Ingredientes que delatan un alérgeno — Nutri-OS
#
# Existe por un desajuste real: la misma avena estaba etiquetada de tres formas
# distintas en tres recetas —`[gluten]`, `[huevo]` y `[]`—, así que un niño con
# evitación de gluten quedaba filtrado de una y expuesto a las otras dos. Un
# alérgeno declarado a mano receta por receta se desincroniza solo.
#
# `motor/revisar.py` lee este archivo, mira la lista de ingredientes de cada
# receta de /biblioteca/ y comprueba que `alergenos_presentes` no se deje
# ninguno. No sustituye el criterio de P1: lo verifica.
#
# CÓMO SE COMPARA
#   Se normaliza la línea del ingrediente (minúsculas, sin tildes) y se busca
#   cada término como PALABRA COMPLETA, no como subcadena: 'mani' no encuentra
#   'manzana' ni 'mandarina'. Los términos de varias palabras se buscan enteros.
#
#   `excepciones` son las expresiones que contienen un término pero no llevan el
#   alérgeno. Si una excepción aparece en la línea, esa línea deja de contar para
#   ese alérgeno. Es lo que separa la mantequilla de vaca de la de maní.
#
# CRITERIO DE LA AVENA
#   La avena no contiene gluten por sí misma, pero comparte campo, cosecha,
#   transporte y molino con el trigo, y la contaminación cruzada es real y
#   medible. Por eso `avena` cuenta como gluten, salvo que la receta especifique
#   avena CERTIFICADA sin gluten, que es la excepción que la libera. Es el mismo
#   criterio que P1_RECETAS.md ya aplicaba a las etiquetas: «La avena solo
#   permite `sin gluten` si la receta especifica avena certificada».
#
# El maní va aparte de los frutos secos a propósito: es una leguminosa y en
# alergia pediátrica es otro alérgeno. Ver datos/alimentos_base.yaml.

gluten:
  terminos:
    - trigo
    - harina de trigo
    - pan
    - panes
    - pan integral
    - pan de molde
    - avena
    - hojuelas de avena
    - harina de avena
    - salvado de avena
    - cebada
    - centeno
    - semola
    - fideos
    - pasta de trigo
    - galletas de trigo
    - pan rallado
    - couscous
  excepciones:
    - avena certificada
    - avena certificada sin gluten
    - harina de avena certificada
    - hojuelas de avena certificadas

